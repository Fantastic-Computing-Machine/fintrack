name: fintrack

services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fintrack
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U fintrack -d fintrack
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  fintrack:
    image: yourdockerhubuser/fintrack:${FINTRACK_VERSION:-latest}

    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}

    env_file:
      - path: ./api/.env
        format: raw

    environment:
      DATABASE_URL: postgresql+psycopg://fintrack:${POSTGRES_PASSWORD}@postgres:5432/fintrack

    ports:
      - "3000:3000"
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    restart: unless-stopped


volumes:
  postgres-data:
